<!-- Header principal avec effet sticky -->
<header class="header" [class.sticky]="isSticky">
  <div class="header-container">
    <!-- Logo et nom de la boutique -->
    <div class="header-logo" (click)="scrollToSection('hero')">
      <img
        src="assets/images/WhatsApp Image 2025-12-22 at 17.32.34.jpeg"
        alt="Les Senteurs d'Amira Logo"
        class="logo-image"
        loading="eager">
      <span class="logo-text">Les Senteurs d'Amira</span>
    </div>

    <!-- Navigation desktop -->
    <nav class="header-nav">
      <ul class="nav-list">
        <li class="nav-item">
          <a (click)="scrollToSection('hero')" class="nav-link">Accueil</a>
        </li>
        <li class="nav-item">
          <a (click)="scrollToSection('catalogue')" class="nav-link">Catalogue</a>
        </li>
        <li class="nav-item">
          <a (click)="scrollToSection('about')" class="nav-link">À propos</a>
        </li>
        <li class="nav-item">
          <a (click)="scrollToSection('contact')" class="nav-link">Contact</a>
        </li>
        <li class="nav-item">
          <a (click)="goToOrders()" class="nav-link">Mes Commandes</a>
        </li>
      </ul>
    </nav>

    <!-- Actions header -->
    <div class="header-actions">
      <!-- Bouton login admin -->
      <button
        class="login-button"
        (click)="goToAdminLogin()"
        aria-label="Connexion admin">
        <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4M10 17l5-5-5-5M13.8 12H3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <!-- Bouton panier -->
      <button
        class="cart-button"
        (click)="onCartClick()"
        aria-label="Ouvrir le panier">
        <svg class="cart-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
          <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="cart-badge" *ngIf="cartItemCount > 0">{{ cartItemCount }}</span>
      </button>
    </div>

    <!-- Bouton menu burger mobile -->
    <button
      class="burger-button"
      (click)="toggleMenu()"
      [class.open]="menuOpen"
      aria-label="Menu de navigation"
      aria-expanded="menuOpen">
      <span class="burger-line"></span>
      <span class="burger-line"></span>
      <span class="burger-line"></span>
    </button>
  </div>

  <!-- Menu mobile overlay -->
  <div class="mobile-menu" [class.open]="menuOpen" (click)="closeMenu()">
    <nav class="mobile-nav" (click)="$event.stopPropagation()">
      <ul class="mobile-nav-list">
        <li class="mobile-nav-item">
          <a (click)="scrollToSection('hero')" class="mobile-nav-link">Accueil</a>
        </li>
        <li class="mobile-nav-item">
          <a (click)="scrollToSection('catalogue')" class="mobile-nav-link">Catalogue</a>
        </li>
        <li class="mobile-nav-item">
          <a (click)="scrollToSection('about')" class="mobile-nav-link">À propos</a>
        </li>
        <li class="mobile-nav-item">
          <a (click)="scrollToSection('contact')" class="mobile-nav-link">Contact</a>
        </li>
        <li class="mobile-nav-item">
          <a (click)="goToOrders()" class="mobile-nav-link">Mes Commandes</a>
        </li>
      </ul>
    </nav>
  </div>
</header>
