<!-- Modal overlay -->
<div
  class="modal-overlay"
  *ngIf="isOpen"
  [class.animating]="isAnimating"
  (click)="onOverlayClick($event)"
  role="dialog"
  aria-modal="true"
  aria-label="Formulaire de contact">

  <!-- Conteneur du modal -->
  <div class="modal-container" [class.animating]="isAnimating">
    <!-- Bouton de fermeture -->
    <button
      class="modal-close"
      (click)="close()"
      aria-label="Fermer le modal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M6 6l12 12M6 18L18 6" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Contenu du modal -->
    <div class="modal-content">
      <!-- En-tête -->
      <div class="modal-header">
        <h2 class="modal-title">Contactez-nous</h2>
        <p class="modal-subtitle" *ngIf="product">
          Pour le produit : <strong>{{ product.nom }}</strong>
        </p>
      </div>

      <!-- Informations de contact rapide -->
      <div class="quick-contact">
        <h3 class="quick-contact-title">Contact rapide</h3>

        <!-- WhatsApp -->
        <div class="contact-item">
          <div class="contact-item-info">
            <svg class="contact-icon whatsapp" viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
            </svg>
            <span class="contact-label">WhatsApp :</span>
            <span class="contact-value">{{ contactInfo.whatsapp }}</span>
          </div>
          <button
            class="btn-copy"
            (click)="copyWhatsApp()"
            [class.copied]="whatsappCopied"
            aria-label="Copier le numéro WhatsApp">
            {{ whatsappCopied ? 'Copié !' : 'Copier' }}
          </button>
        </div>

        <!-- Actions rapides -->
        <div class="quick-actions">
          <button class="btn-action btn-whatsapp" (click)="openWhatsApp()">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/>
            </svg>
            Ouvrir WhatsApp
          </button>

          <button class="btn-action btn-phone" (click)="callPhone()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6 19.79 19.79 0 01-3.07-8.67A2 2 0 014.11 2h3a2 2 0 012 1.72 12.84 12.84 0 00.7 2.81 2 2 0 01-.45 2.11L8.09 9.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45 12.84 12.84 0 002.81.7A2 2 0 0122 16.92z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Appeler
          </button>
        </div>
      </div>

      <!-- Formulaire de contact -->
      <form [formGroup]="contactForm" class="contact-form">
        <h3 class="form-title">Ou envoyez-nous un message</h3>

        <!-- Nom -->
        <div class="form-group">
          <label for="nom" class="form-label">Nom complet *</label>
          <input
            type="text"
            id="nom"
            formControlName="nom"
            class="form-input"
            [class.invalid]="isFieldInvalid('nom')"
            placeholder="Votre nom">
          <span class="form-error" *ngIf="isFieldInvalid('nom')">
            {{ getErrorMessage('nom') }}
          </span>
        </div>

        <!-- Email -->
        <div class="form-group">
          <label for="email" class="form-label">Email *</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            class="form-input"
            [class.invalid]="isFieldInvalid('email')"
            placeholder="votre@email.com">
          <span class="form-error" *ngIf="isFieldInvalid('email')">
            {{ getErrorMessage('email') }}
          </span>
        </div>

        <!-- Téléphone -->
        <div class="form-group">
          <label for="telephone" class="form-label">Téléphone *</label>
          <input
            type="tel"
            id="telephone"
            formControlName="telephone"
            class="form-input"
            [class.invalid]="isFieldInvalid('telephone')"
            placeholder="+33 6 12 34 56 78">
          <span class="form-error" *ngIf="isFieldInvalid('telephone')">
            {{ getErrorMessage('telephone') }}
          </span>
        </div>

        <!-- Message -->
        <div class="form-group">
          <label for="message" class="form-label">Message *</label>
          <textarea
            id="message"
            formControlName="message"
            class="form-textarea"
            [class.invalid]="isFieldInvalid('message')"
            rows="5"
            placeholder="Votre message..."></textarea>
          <span class="form-error" *ngIf="isFieldInvalid('message')">
            {{ getErrorMessage('message') }}
          </span>
        </div>

        <!-- Bouton d'envoi -->
        <button
          type="button"
          class="btn-submit"
          [disabled]="contactForm.invalid"
          (click)="sendEmail()">
          Envoyer par email
        </button>
      </form>
    </div>
  </div>
</div>
