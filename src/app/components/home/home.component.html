<!-- Contenu principal de la page d'accueil -->
<main class="main-content">
  <!-- Section Hero -->
  <app-hero></app-hero>

  <!-- Section Catalogue Stripe -->
  <app-stripe-product-list></app-stripe-product-list>

  <!-- Section À propos -->
  <app-about></app-about>
</main>

<!-- Modal Produit -->
<app-product-modal
  [product]="selectedProduct"
  (closeModal)="closeProductModal()"
  (openContact)="openContactModal($event)">
</app-product-modal>

<!-- Modal Contact -->
<app-contact-modal
  [isOpen]="isContactModalOpen"
  [product]="contactProduct"
  (closeModal)="closeContactModal()">
</app-contact-modal>
