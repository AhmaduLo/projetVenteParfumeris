<!-- Modal overlay -->
<div
  class="modal-overlay"
  *ngIf="product"
  [class.animating]="isAnimating"
  (click)="onOverlayClick($event)"
  role="dialog"
  aria-modal="true"
  [attr.aria-label]="'Détails du produit ' + product.name">

  <!-- Conteneur du modal -->
  <div class="modal-container" [class.animating]="isAnimating">
    <!-- Bouton de fermeture -->
    <button
      class="modal-close"
      (click)="close()"
      aria-label="Fermer le modal">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M6 6l12 12M6 18L18 6" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>

    <!-- Contenu du modal -->
    <div class="modal-content">
      <!-- Image du produit avec slider -->
      <div class="modal-image-container"
           (touchstart)="onTouchStart($event)"
           (touchmove)="onTouchMove($event)"
           (touchend)="onTouchEnd()">

        <!-- Image principale -->
        <img
          [src]="getCurrentImage()"
          [alt]="product.name"
          [class.zoomed]="isZoomed"
          class="modal-image"
          (click)="onImageClick($event)"
          loading="eager">

        <!-- Badge nouveau -->
        <div class="modal-badge" *ngIf="product.metadata['nouveau'] === 'true'">
          NOUVEAU
        </div>

        <!-- Flèches de navigation (affichées seulement s'il y a plusieurs images) -->
        <button
          *ngIf="getImagesCount() > 1"
          class="slider-arrow slider-arrow-left"
          (click)="previousImage(); onArrowClick($event)"
          aria-label="Image précédente">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M15 18l-6-6 6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button
          *ngIf="getImagesCount() > 1"
          class="slider-arrow slider-arrow-right"
          (click)="nextImage(); onArrowClick($event)"
          aria-label="Image suivante">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M9 18l6-6-6-6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <!-- Indicateur de position (dots) -->
        <div class="slider-dots" *ngIf="getImagesCount() > 1">
          <button
            *ngFor="let image of product.images; let i = index"
            class="slider-dot"
            [class.active]="i === currentImageIndex"
            (click)="goToImage(i); onArrowClick($event)"
            [attr.aria-label]="'Aller à l\'image ' + (i + 1)">
          </button>
        </div>

        <!-- Compteur d'images -->
        <div class="image-counter" *ngIf="getImagesCount() > 1">
          {{ currentImageIndex + 1 }} / {{ getImagesCount() }}
        </div>

        <!-- Indicateur de zoom -->
        <div class="zoom-indicator" *ngIf="!isZoomed">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <circle cx="11" cy="11" r="8" stroke-width="2"/>
            <path d="M21 21l-4.35-4.35" stroke-width="2" stroke-linecap="round"/>
            <path d="M11 8v6M8 11h6" stroke-width="2" stroke-linecap="round"/>
          </svg>
          Cliquer pour zoomer
        </div>
      </div>

      <!-- Informations du produit -->
      <div class="modal-info">
        <span class="modal-category">{{ getCategoryLabel() }}</span>
        <h2 class="modal-title">{{ product.name }}</h2>
        <p class="modal-price" *ngIf="product.price">{{ product.price.formatted }}</p>

        <p class="modal-description">{{ product.description }}</p>

        <!-- Caractéristiques -->
        <div class="modal-characteristics" *ngIf="hasCharacteristics()">
          <h3 class="characteristics-title">Caractéristiques</h3>

          <div class="characteristic-item" *ngFor="let characteristic of getCharacteristics()">
            <span class="characteristic-label">{{ characteristic.label }} :</span>
            <span class="characteristic-value">{{ characteristic.value }}</span>
          </div>
        </div>

        <!-- Sélecteur de quantité -->
        <div class="product-quantity">
          <label class="quantity-label">Quantité :</label>
          <div class="quantity-selector">
            <button class="qty-btn" (click)="decreaseQuantity()" [disabled]="quantity <= 1" aria-label="Diminuer">-</button>
            <span class="qty-value">{{ quantity }}</span>
            <button class="qty-btn" (click)="increaseQuantity()" aria-label="Augmenter">+</button>
          </div>
        </div>

        <!-- Message de confirmation -->
        <div class="added-message" *ngIf="addedToCartMessage">
          ✓ Ajouté au panier !
        </div>

        <!-- Boutons d'action -->
        <div class="modal-actions">
          <button
            class="modal-cta modal-cta-cart"
            (click)="addToCart()"
            [disabled]="!product.price"
            aria-label="Ajouter au panier">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
              <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Ajouter au panier
          </button>

          <button
            class="modal-cta modal-cta-contact"
            (click)="contactForProduct()"
            aria-label="Demander des informations">
            Ou demander des informations
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
